<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#248A3D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Apple squircle background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  
  <!-- White Blister Card Base with subtle shadow -->
  <g filter="url(#shadow)">
    <rect x="42" y="38" width="108" height="116" rx="18" fill="#FFFFFF" opacity="0.96" />
    
    <!-- Blister Pocket Circles -->
    <!-- Row 1 -->
    <circle cx="68" cy="62" r="14" fill="#E5E5EA" />
    <circle cx="68" cy="62" r="10" fill="#0A84FF" opacity="0.9" />
    
    <circle cx="124" cy="62" r="14" fill="#E5E5EA" />
    <circle cx="124" cy="62" r="10" fill="#0A84FF" opacity="0.9" />
    
    <!-- Row 2 -->
    <circle cx="68" cy="96" r="14" fill="#E5E5EA" />
    <circle cx="68" cy="96" r="10" fill="#34C759" opacity="0.9" />
    
    <circle cx="124" cy="96" r="14" fill="#E5E5EA" />
    <circle cx="124" cy="96" r="10" fill="#34C759" opacity="0.9" />
    
    <!-- Row 3 (Pill consumed / active) -->
    <circle cx="68" cy="130" r="14" fill="#E5E5EA" />
    <circle cx="68" cy="130" r="10" fill="#FF9F0A" opacity="0.9" />
    
    <circle cx="124" cy="130" r="14" fill="#F2F2F7" stroke="#D1D1D6" stroke-width="2" stroke-dasharray="3 3" />
  </g>
  
  <!-- Subtle heart / cross accent -->
  <path d="M96 28 L96 36 M92 32 L100 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>
